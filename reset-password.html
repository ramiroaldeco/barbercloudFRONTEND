<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BarberCloud - Nueva Contraseña</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bc-bg: #090e14;
      --bc-panel: rgba(13, 19, 31, 0.65);
      --bc-border: rgba(255, 255, 255, 0.08);
      --bc-border-h: rgba(255, 255, 255, 0.16);
      --bc-text: #f8fafc;
      --bc-cyan: #3b82f6;
      --bc-cyan-hover: #2563eb;
      --bc-shadow: 0 10px 30px -5px rgba(0,0,0,0.4);
      --bc-radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    body.app {
      background-color: var(--bc-bg);
      color: var(--bc-text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body.app::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(1200px 800px at 50% 10%, rgba(59,130,246,0.08), transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: var(--bc-radius);
      background: var(--bc-panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--bc-border);
      box-shadow: var(--bc-shadow);
      padding: 32px 28px;
    }

    h2 { margin: 0 0 24px 0; font-size: 1.4rem; font-weight: 700; text-align: center; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .field label { font-size: .78rem; font-weight: 650; text-transform: uppercase; color: rgba(226,232,240,.82); }
    .field input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--bc-border); background: rgba(0,0,0,0.3); color: var(--bc-text); outline: none; font-size: .96rem; transition: var(--transition); }
    .field input:focus { border-color: var(--bc-cyan); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }

    .btn-primary { background: linear-gradient(180deg, var(--bc-cyan), var(--bc-cyan-hover)); border: 1px solid rgba(59,130,246,0.4); color: #fff; font-weight: 600; border-radius: 12px; padding: 14px 24px; width: 100%; font-size: 1rem; cursor: pointer; transition: var(--transition); }
    .btn-primary:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .msg { margin-top: 16px; text-align: center; font-size: 0.9rem; color: #10b981; }
    .error-msg { margin-top: 16px; text-align: center; font-size: 0.9rem; color: #ef4444; }

    .back-link { display: block; text-align: center; margin-top: 24px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body class="app">
  <div class="auth-card">
    <h2>Elegí nueva contraseña</h2>

    <!-- Se oculta si no hay token -->
    <div id="missingToken" style="display:none; text-align:center;">
      <p class="error-msg">El enlace es inválido o no tiene token de seguridad.</p>
      <a href="./forgot-password.html" class="back-link" style="margin-top:10px;">Solicitar nuevo código</a>
    </div>

    <form id="resetForm" style="display:none;">
      <input type="hidden" id="tokenInput" />
      
      <div class="field">
        <label>Nueva Contraseña</label>
        <input type="password" id="pass1" placeholder="Mínimo 6 caracteres" required minlength="6"/>
      </div>

      <div class="field">
        <label>Repetir Contraseña</label>
        <input type="password" id="pass2" placeholder="Repetí la misma contraseña" required minlength="6"/>
        <div id="passErr" class="error-msg" style="display:none; text-align:left; margin-top:6px;">Las contraseñas no coinciden.</div>
      </div>

      <button type="submit" class="btn-primary" id="btnSubmit">Guardar nueva contraseña</button>
      <div id="msgBox"></div>
    </form>

    <a href="./admin_v2.html" class="back-link">← Volver al login</a>
  </div>

  <script src="./config.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const missingToken = document.getElementById("missingToken");
    const pass1 = document.getElementById("pass1");
    const pass2 = document.getElementById("pass2");
    const passErr = document.getElementById("passErr");
    const btnSubmit = document.getElementById("btnSubmit");
    const msgBox = document.getElementById("msgBox");

    // Extraer token de URL (?token=xyz)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      missingToken.style.display = "block";
    } else {
      document.getElementById("tokenInput").value = token;
      form.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      if (pass1.value !== pass2.value) {
        passErr.style.display = "block";
        return;
      }
      passErr.style.display = "none";

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Guardando...";
      msgBox.className = "";
      msgBox.textContent = "";

      try {
        const res = await fetch(API_BASE + "/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: pass1.value })
        });
        const data = await res.json();
        
        if (data.ok) {
          msgBox.className = "msg";
          // Success! Hide form entirely
          form.innerHTML = `
            <div style="text-align:center; margin-top:20px;">
              <h3 style="color:#10b981; margin:0 0 10px;">¡Listo!</h3>
              <p style="color:#f8fafc;">${data.message}</p>
              <a href="./admin_v2.html" class="btn-primary" style="display:inline-block; margin-top:15px; text-decoration:none;">Ir a Iniciar Sesión</a>
            </div>
          `;
        } else {
          msgBox.className = "error-msg";
          msgBox.textContent = data.error || "Ocurrió un error inesperado al restablecer.";
        }
      } catch (err) {
        msgBox.className = "error-msg";
        msgBox.textContent = "Error de conexión. Intentá más tarde.";
      } finally {
        if(btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Guardar nueva contraseña";
        }
      }
    });
  </script>
</body>
</html>
