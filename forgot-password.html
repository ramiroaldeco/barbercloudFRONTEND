<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BarberCloud - Recuperar Contraseña</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bc-bg: #090e14;
      --bc-panel: rgba(13, 19, 31, 0.65);
      --bc-border: rgba(255, 255, 255, 0.08);
      --bc-border-h: rgba(255, 255, 255, 0.16);
      --bc-text: #f8fafc;
      --bc-muted: #94a3b8;
      --bc-cyan: #3b82f6;
      --bc-cyan-hover: #2563eb;
      --bc-shadow: 0 10px 30px -5px rgba(0,0,0,0.4);
      --bc-radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    body.app {
      background-color: var(--bc-bg);
      color: var(--bc-text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body.app::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(1200px 800px at 50% 10%, rgba(59,130,246,0.08), transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: var(--bc-radius);
      background: var(--bc-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--bc-border);
      box-shadow: var(--bc-shadow);
      padding: 32px 28px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
    }

    p.sub {
      margin: 0 0 24px 0;
      color: var(--bc-muted);
      line-height: 1.5;
      font-size: 0.95rem;
      text-align: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    .field label {
      font-size: .78rem;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(226,232,240,.82);
    }

    .field input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--bc-border);
      background: rgba(0,0,0,0.3);
      color: var(--bc-text);
      outline: none;
      font-size: .96rem;
      transition: var(--transition);
    }

    .field input:focus {
      border-color: var(--bc-cyan);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--bc-cyan), var(--bc-cyan-hover));
      border: 1px solid rgba(59,130,246,0.4);
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 14px 24px;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(59,130,246,0.4);
    }
    
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--bc-cyan);
    }

    .error-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #ef4444;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--bc-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body class="app">
  <div class="auth-card">
    <h2>Recuperar Contraseña</h2>
    <p class="sub">Ingresá el email de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>

    <form id="forgotForm">
      <div class="field">
        <label>Email de tu cuenta</label>
        <input type="email" id="email" placeholder="tu@email.com" required />
      </div>

      <button type="submit" class="btn-primary" id="btnSubmit">Enviar enlace</button>
      
      <div id="msgBox"></div>
    </form>

    <a href="./admin_v2.html" class="back-link">← Volver al login</a>
  </div>

  <script src="./config.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const btn = document.getElementById("btnSubmit");
    const msgBox = document.getElementById("msgBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if(!email) return;

      btn.disabled = true;
      btn.textContent = "Enviando...";
      msgBox.className = "";
      msgBox.textContent = "";

      try {
        const res = await fetch(API_BASE + "/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (data.ok) {
          msgBox.className = "msg";
          msgBox.textContent = data.message;
          form.reset();
        } else {
          msgBox.className = "error-msg";
          msgBox.textContent = data.error || "Ocurrió un error inesperado.";
        }
      } catch (err) {
        msgBox.className = "error-msg";
        msgBox.textContent = "Error de conexión. Intentá más tarde.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar enlace";
      }
    });
  </script>
</body>
</html>
